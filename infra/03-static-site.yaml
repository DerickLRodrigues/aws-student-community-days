AWSTemplateFormatVersion: '2010-09-09'
Description: Static community website on private S3 and CloudFront, with GitHub OIDC deployment and staged domain migration.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: infra/DEPLOY.md
        has: deployment and Amplify migration procedure
Parameters:
  DomainName:
    Type: String
    Default: awsstudentcommunitydays.com.br
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  EnableAliases:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only after the old Amplify association has released the domain.
  GitHubRepository:
    Type: String
    Default: DerickLRodrigues/aws-student-community-days
  GitHubImmutableRepository:
    Type: String
    Default: DerickLRodrigues@124528221/aws-student-community-days@1377172321
Conditions:
  AliasesEnabled: !Equals [!Ref EnableAliases, 'true']
Resources:
  # Retained on stack removal; private REST origin only, never an S3 website endpoint.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: BoundOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  # Legacy CloudFront log delivery requires ACLs; this separate bucket stays private.
  AccessLogs:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerPreferred}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 14
  AccessLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AccessLogs.Arn, !Sub '${AccessLogs.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  # DNS validation adds CNAME records only; it does not switch the live website.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId
  # HTML varies in the browser via ?ano=, not at the origin. Do not fragment cache.
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static'
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  # Keep the existing strict CSP. Scripts and styles must remain external files.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'geolocation=(), camera=(), microphone=(), payment=(), usb=()'
              Override: true
  # S3 REST does not resolve directory indexes. Preserve query strings in redirects.
  RoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Directory indexes and canonical www redirect
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var query = [];
          var params = request.querystring || {};
          for (var key in params) {
            var values = params[key].multiValue || [params[key]];
            for (var i = 0; i < values.length; i++) {
              query.push(key + '=' + values[i].value);
            }
          }
          var suffix = query.length ? '?' + query.join('&') : '';
          var directory = uri.indexOf('/.') === -1 && uri.charAt(uri.length - 1) !== '/' && uri.split('/').pop().indexOf('.') === -1;
          if (request.headers.host.value === 'www.${DomainName}' || directory) {
            var target = uri + (directory ? '/' : '') + suffix;
            target = 'https://' + (request.headers.host.value === 'www.${DomainName}' ? '${DomainName}' : request.headers.host.value) + target;
            return {statusCode: 301, statusDescription: 'Moved Permanently', headers: {
              location: {value: target},
              'cache-control': {value: 'public, max-age=300'},
              'strict-transport-security': {value: 'max-age=31536000; includeSubDomains'},
              'x-content-type-options': {value: 'nosniff'}
            }};
          }
          if (uri.charAt(uri.length - 1) === '/') request.uri += 'index.html';
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${AWS::StackName} - Student Community Days'
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Aliases: !If [AliasesEnabled, [!Ref DomainName, !Sub 'www.${DomainName}'], !Ref 'AWS::NoValue']
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2025
        Origins:
          - Id: private-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: private-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RoutingFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        Logging:
          Bucket: !GetAtt AccessLogs.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyFromThisDistribution
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  # New provider: account discovery confirmed there was no existing GitHub provider.
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  # Both GitHub subject formats are exact matches, main branch only; no PR access.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOIDC}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubImmutableRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: PublishOnlyThisSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
Outputs:
  BucketName:
    Description: Private bucket receiving public site files
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution for deployments
    Value: !Ref Distribution
  CloudFrontDomain:
    Description: Test this URL before changing production DNS
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Description: GitHub OIDC role, no access key required
    Value: !GetAtt DeployRole.Arn
  CertificateArn:
    Description: Independent certificate retained by this stack, not Amplify
    Value: !Ref Certificate
